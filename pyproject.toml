[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custos-protocol"
version = "1.0.0"
description = "Custos — pre-transaction asset-truth attestation for autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Akul Ranjan", email = "akulranjan06@gmail.com" },
]
keywords = ["agents", "attestation", "verification", "treasury", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "cryptography>=42.0,<47.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "httpx>=0.27,<1.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<15.0",
]

[project.scripts]
custos = "custos_protocol.cli:cli"
custos-admin = "gateway.admin_cli:cli"

[project.urls]
Homepage = "https://github.com/AkulRanjan/APay-Gateway"
Repository = "https://github.com/AkulRanjan/APay-Gateway"
Issues = "https://github.com/AkulRanjan/APay-Gateway/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["custos_protocol"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
